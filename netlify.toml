# Netlify : le site n'est mis en ligne qu'à la publication d'un tag Git.
# Les builds déclenchés par Netlify (push sur une branche, deploy previews) sont tous annulés
# par « ignore » (code de sortie 0 = ne pas construire). Le build et la mise en ligne sont faits
# par GitHub Actions : .github/workflows/deploiement-netlify.yml (netlify deploy --prod --no-build).
[build]
  command = "npm run build"
  publish = "dist"
  ignore = "exit 0"

# En-têtes repris de nginx.conf (ancien déploiement Docker / Dokploy).
# Pas de Cache-Control sur /* : Netlify sert déjà le HTML en « max-age=0, must-revalidate »,
# et deux règles qui définissent le même en-tête voient leurs valeurs fusionnées.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # 'wasm-unsafe-eval' : requis par Pagefind
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"

# Assets hashés par Astro : cache long immuable
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Index Pagefind (pagefind.js et l'entrée ne sont pas hashés)
[[headers]]
  for = "/pagefind/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# PWA : le service worker doit être revalidé à chaque visite (mise à jour du site)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"
